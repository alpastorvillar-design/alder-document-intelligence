name: innovation-evidence-pipeline

x-app: &app
  image: innovation-evidence-pipeline:local
  build:
    context: .
    dockerfile: docker/Dockerfile
  environment:
    IEP_DATABASE_URL: postgresql+psycopg://iep:${POSTGRES_PASSWORD:-iep}@postgres:5432/iep
    IEP_STORAGE_ROOT: /var/lib/iep/objects
    IEP_REPORT_ROOT: /var/lib/iep/reports
    IEP_SEMANTIC_PROVIDER: ${IEP_SEMANTIC_PROVIDER:-deterministic}
    IEP_REGISTRY_API_BASE_URL: http://devsources:8080
    IEP_REGISTRY_API_TOKEN: ${IEP_REGISTRY_API_TOKEN:-local-development-token}
    IEP_SCRAPER_ALLOWLIST: devsources,localhost,127.0.0.1
    # Pointing the hosted provider at the local simulator lets the whole
    # adapter path run with no key and no cost. Override both to talk to a
    # real provider; see docs/llm-demo.md.
    IEP_LLM_BASE_URL: ${IEP_LLM_BASE_URL:-http://devsources:8080}
    IEP_LLM_API_KEY: ${IEP_LLM_API_KEY:-}
    IEP_LLM_MODEL: ${IEP_LLM_MODEL:-claude-haiku-4-5}
    # The deterministic hashing provider exercises the vector storage and
    # hybrid-retrieval path offline. It is explicitly not described as a
    # semantic model. Set both external-AI opt-in and an API key before using
    # the hosted embedding or RAG providers.
    IEP_EMBEDDING_PROVIDER: ${IEP_EMBEDDING_PROVIDER:-hashing}
    IEP_OPENAI_BASE_URL: ${IEP_OPENAI_BASE_URL:-https://api.openai.com/v1}
    IEP_OPENAI_API_KEY: ${IEP_OPENAI_API_KEY:-}
    IEP_OPENAI_EMBEDDING_MODEL: ${IEP_OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    IEP_RAG_PROVIDER: ${IEP_RAG_PROVIDER:-disabled}
    # The `cli` provider needs the binary on the process's PATH, which a
    # container does not have - it is passed through so the screen can say so
    # rather than fail obscurely. docs/rag.md explains the host-side run.
    IEP_RAG_CLI_TOOL: ${IEP_RAG_CLI_TOOL:-claude}
    IEP_RAG_CLI_MODEL: ${IEP_RAG_CLI_MODEL:-}
    IEP_RAG_CALL_BUDGET: ${IEP_RAG_CALL_BUDGET:-40}
    # Unset by default so the floor follows the embedding provider.
    IEP_RETRIEVAL_MIN_SIMILARITY: ${IEP_RETRIEVAL_MIN_SIMILARITY:-}
    # A container cannot reach a host's Ollama on localhost.
    IEP_OLLAMA_BASE_URL: ${IEP_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    IEP_OLLAMA_MODEL: ${IEP_OLLAMA_MODEL:-}
    IEP_OLLAMA_EMBEDDING_MODEL: ${IEP_OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:4b}
    IEP_OPENAI_RAG_MODEL: ${IEP_OPENAI_RAG_MODEL:-gpt-4o-mini}
    IEP_ALLOW_EXTERNAL_AI: ${IEP_ALLOW_EXTERNAL_AI:-false}
    IEP_API_KEY: ${IEP_API_KEY:-}
    IEP_LOG_LEVEL: ${IEP_LOG_LEVEL:-INFO}
  volumes:
    - objects:/var/lib/iep
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_USER: iep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iep}
      POSTGRES_DB: iep
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iep -d iep"]
      interval: 3s
      timeout: 3s
      retries: 20
    # Published on a non-default port so host-side integration tests and psql
    # can reach it without colliding with a local PostgreSQL install. In a real
    # deployment the database would not be reachable outside its network.
    ports:
      - "127.0.0.1:55432:5432"

  api:
    <<: *app
    command:
      - sh
      - -c
      - "alembic upgrade head && uvicorn iep.api.app:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *app
    command: ["python", "-m", "iep.worker.runner"]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Development-only stand-in for the corporate systems the pipeline reads
  # from: a paginated HTTP registry and a static public page. It is a separate
  # application (package `devsources`) so that no test-support endpoint can
  # ever be reachable through the product API.
  devsources:
    <<: *app
    command:
      - uvicorn
      - devsources.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    depends_on: []
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional. The core pipeline runs without it: `docker compose up` alone
  # never starts n8n.
  n8n:
    profiles: ["n8n"]
    image: n8nio/n8n:1.121.2
    environment:
      N8N_PORT: 5678
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      GENERIC_TIMEZONE: Europe/Madrid
      # The workflow reaches the API over the container network; the link it
      # puts in a notification is opened by a person in a browser. Same
      # service, different host, so they are separate settings.
      IEP_API_BASE_URL: http://api:8000
      IEP_REVIEW_BASE_URL: ${IEP_REVIEW_BASE_URL:-http://127.0.0.1:8000}
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n
      - ./automation/n8n:/workflows:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  objects:
  n8ndata:
