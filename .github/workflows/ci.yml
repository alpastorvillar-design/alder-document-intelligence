name: ci

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: iep
          POSTGRES_PASSWORD: iep
          POSTGRES_DB: iep
        options: >-
          --health-cmd "pg_isready -U iep -d iep"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      IEP_DATABASE_URL: postgresql+psycopg://iep:iep@localhost:5432/iep
      IEP_STORAGE_ROOT: ${{ github.workspace }}/var/objects
      IEP_REPORT_ROOT: ${{ github.workspace }}/var/reports
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Tesseract with the Spanish language pack
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tesseract-ocr tesseract-ocr-spa
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: alembic upgrade head
      - run: pytest -q --cov=iep --cov-report=term-missing

  measure:
    runs-on: ubuntu-24.04
    needs: test
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: iep
          POSTGRES_PASSWORD: iep
          POSTGRES_DB: iep
        options: >-
          --health-cmd "pg_isready -U iep -d iep"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      IEP_DATABASE_URL: postgresql+psycopg://iep:iep@localhost:5432/iep
      IEP_STORAGE_ROOT: ${{ github.workspace }}/var/objects
      IEP_REPORT_ROOT: ${{ github.workspace }}/var/reports
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Tesseract with the Spanish language pack
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tesseract-ocr tesseract-ocr-spa
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: alembic upgrade head
      - name: Rebuild the synthetic corpus and re-run the evaluation
        run: |
          python -m corpus.generate --out corpus/out
          python -m evaluation.run_eval --corpus corpus/out --out evaluation/out
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: evaluation/out/

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build the single project image
        run: docker build -f docker/Dockerfile -t innovation-evidence-pipeline:local .
      - name: Verify the OCR toolchain inside the image
        run: |
          docker run --rm innovation-evidence-pipeline:local tesseract --version
          docker run --rm innovation-evidence-pipeline:local \
            python -c "import pytesseract, fitz, openpyxl; print('extractors importable')"
